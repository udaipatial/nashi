<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="lanternNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141113"/>
      <stop offset="50%" stop-color="#261C19"/>
      <stop offset="100%" stop-color="#3A281E"/>
    </linearGradient>

    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDD99" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#F5A642" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#C24D3D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#141113" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="paperLantern" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97236"/>
      <stop offset="50%" stop-color="#FFD478"/>
      <stop offset="100%" stop-color="#B84B20"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#lanternNight)"/>

  <!-- Warm Atmospheric Glow -->
  <circle cx="300" cy="280" r="220" fill="url(#lanternGlow)"/>

  <!-- Distant Silhouette of Japanese Teahouse Roof -->
  <path d="M 40 440 Q 200 400 300 400 T 560 440 L 560 600 L 40 600 Z" fill="#181313"/>
  <path d="M 120 400 Q 300 360 480 400" stroke="#0D0A0A" stroke-width="8" stroke-linecap="round"/>

  <!-- Hanging Japanese Paper Lantern (Chōchin) -->
  <!-- Cord -->
  <line x1="300" y1="60" x2="300" y2="180" stroke="#3D2B1F" stroke-width="3"/>

  <!-- Lantern Top Cap -->
  <rect x="250" y="180" width="100" height="18" rx="4" fill="#1C140F"/>

  <!-- Lantern Body -->
  <ellipse cx="300" cy="290" rx="90" ry="110" fill="url(#paperLantern)"/>

  <!-- Horizontal Ribs (Washi wire rings) -->
  <g fill="none" stroke="#662911" stroke-width="2" opacity="0.45">
    <ellipse cx="300" cy="220" rx="60" ry="12"/>
    <ellipse cx="300" cy="250" rx="80" ry="14"/>
    <ellipse cx="300" cy="280" rx="88" ry="15"/>
    <ellipse cx="300" cy="310" rx="88" ry="15"/>
    <ellipse cx="300" cy="340" rx="80" ry="14"/>
    <ellipse cx="300" cy="370" rx="60" ry="12"/>
  </g>

  <!-- Kanji on Lantern: 夜 (Night) -->
  <text x="300" y="315" font-family="'Noto Serif JP', serif" font-size="64" font-weight="900" fill="#2E0E05" opacity="0.8" text-anchor="middle">夜</text>

  <!-- Lantern Bottom Cap & Tassel -->
  <rect x="260" y="390" width="80" height="16" rx="4" fill="#1C140F"/>
  <path d="M 300 406 L 300 460" stroke="#C24D3D" stroke-width="4"/>
  <circle cx="300" cy="465" r="4" fill="#C24D3D"/>

  <!-- Warm Bokeh Sparks / Fireflies -->
  <circle cx="160" cy="220" r="3" fill="#FFE2A0" opacity="0.6"/>
  <circle cx="430" cy="240" r="2.5" fill="#FFE2A0" opacity="0.7"/>
  <circle cx="190" cy="340" r="2" fill="#FFE2A0" opacity="0.5"/>
  <circle cx="410" cy="370" r="3.5" fill="#FFE2A0" opacity="0.65"/>
  <circle cx="260" cy="480" r="2" fill="#FFE2A0" opacity="0.4"/>

  <!-- Red Hanko Seal "夜" -->
  <rect x="520" y="40" width="44" height="44" rx="8" fill="#C24D3D" opacity="0.9"/>
  <text x="542" y="70" font-family="'Noto Serif JP', serif" font-size="24" font-weight="bold" fill="#FFFDF8" text-anchor="middle">夜</text>
</svg>
