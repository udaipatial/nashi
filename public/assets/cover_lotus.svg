<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141C24"/>
      <stop offset="45%" stop-color="#223342"/>
      <stop offset="85%" stop-color="#344D5F"/>
      <stop offset="100%" stop-color="#192833"/>
    </linearGradient>

    <radialGradient id="lotusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCEAE6" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#E88B84" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#C24D3D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#223342" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="petalPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F2"/>
      <stop offset="60%" stop-color="#F2A59B"/>
      <stop offset="100%" stop-color="#C24D3D"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#twilightWater)"/>

  <!-- Crescent Moon in Indigo Twilight -->
  <path d="M 440 100 A 70 70 0 0 0 380 180 A 60 60 0 0 1 450 140 A 55 55 0 0 0 440 100 Z" fill="#FFE8BE" filter="url(#softGlow)" opacity="0.85"/>
  <path d="M 440 100 A 70 70 0 0 0 380 180 A 60 60 0 0 1 450 140 A 55 55 0 0 0 440 100 Z" fill="#FFF2D6"/>

  <!-- Distant Blue Ridge Mountain Silhouette -->
  <path d="M -20 320 Q 140 230 280 270 T 520 250 T 620 290 L 620 600 L -20 600 Z" fill="#16232D" opacity="0.8"/>

  <!-- Calm Water Surface Reflection -->
  <ellipse cx="300" cy="460" rx="180" ry="40" fill="url(#lotusGlow)"/>

  <!-- Floating Lily Pad -->
  <ellipse cx="300" cy="470" rx="150" ry="32" fill="#1C3028"/>
  <ellipse cx="300" cy="470" rx="146" ry="30" fill="#29463B"/>
  <path d="M 300 470 L 370 455" stroke="#1C3028" stroke-width="4"/>

  <!-- Water Lotus Flower Blossom (Sumi-e / Watercolor) -->
  <g transform="translate(300, 410)">
    <!-- Back Petals -->
    <path d="M 0 0 Q -60 -40 -70 -90 Q -40 -60 0 0 Z" fill="#D97268" opacity="0.85"/>
    <path d="M 0 0 Q 60 -40 70 -90 Q 40 -60 0 0 Z" fill="#D97268" opacity="0.85"/>
    <path d="M 0 0 Q -35 -70 -40 -115 Q -15 -80 0 0 Z" fill="#E89187" opacity="0.9"/>
    <path d="M 0 0 Q 35 -70 40 -115 Q 15 -80 0 0 Z" fill="#E89187" opacity="0.9"/>

    <!-- Center Tall Petal -->
    <path d="M 0 0 Q -25 -80 0 -135 Q 25 -80 0 0 Z" fill="url(#petalPink)"/>

    <!-- Front Curved Petals -->
    <path d="M 0 10 Q -45 -30 -50 -75 Q -15 -40 0 10 Z" fill="#FCEAE6"/>
    <path d="M 0 10 Q 45 -30 50 -75 Q 15 -40 0 10 Z" fill="#FCEAE6"/>
    <path d="M 0 15 Q -25 -30 -20 -65 Q 0 -35 0 15 Z" fill="#FFF5F2"/>
    <path d="M 0 15 Q 25 -30 20 -65 Q 0 -35 0 15 Z" fill="#FFF5F2"/>

    <!-- Golden Stamen Core -->
    <circle cx="0" cy="-25" r="8" fill="#FFC83B"/>
  </g>

  <!-- Water Ripples -->
  <ellipse cx="300" cy="510" rx="90" ry="12" fill="none" stroke="#7BA3B8" stroke-width="1.2" opacity="0.5"/>
  <ellipse cx="300" cy="530" rx="140" ry="18" fill="none" stroke="#7BA3B8" stroke-width="0.8" opacity="0.3"/>

  <!-- Red Hanko Seal "蓮" (Lotus) -->
  <rect x="520" y="40" width="44" height="44" rx="8" fill="#C24D3D" opacity="0.9"/>
  <text x="542" y="70" font-family="'Noto Serif JP', serif" font-size="24" font-weight="bold" fill="#FFFDF8" text-anchor="middle">蓮</text>
</svg>
