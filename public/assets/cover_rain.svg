<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="rainSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1E22"/>
      <stop offset="50%" stop-color="#2D363D"/>
      <stop offset="85%" stop-color="#3A464C"/>
      <stop offset="100%" stop-color="#222A2F"/>
    </linearGradient>

    <linearGradient id="bambooGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E6857"/>
      <stop offset="100%" stop-color="#26362C"/>
    </linearGradient>

    <filter id="rainBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Rainy Slate Sky Background -->
  <rect width="600" height="600" fill="url(#rainSky)"/>

  <!-- Distant Misty Mountain Ridges in Rain -->
  <path d="M -10 380 Q 120 290 260 340 T 480 320 T 610 360 L 610 600 L -10 600 Z" fill="#20272E" opacity="0.75" filter="url(#rainBlur)"/>
  <path d="M -10 430 Q 180 370 340 410 T 540 390 T 610 420 L 610 600 L -10 600 Z" fill="#171E24" opacity="0.9"/>

  <!-- Rhythmic Slanted Rain Streaks (Sumi-e Rain technique) -->
  <g stroke="#9EB2C0" stroke-width="1.2" stroke-linecap="round" opacity="0.35">
    <line x1="80" y1="20" x2="40" y2="180"/>
    <line x1="160" y1="40" x2="120" y2="200"/>
    <line x1="240" y1="10" x2="200" y2="170"/>
    <line x1="320" y1="50" x2="280" y2="210"/>
    <line x1="400" y1="30" x2="360" y2="190"/>
    <line x1="480" y1="60" x2="440" y2="220"/>
    <line x1="560" y1="20" x2="520" y2="180"/>

    <line x1="110" y1="220" x2="70" y2="380"/>
    <line x1="190" y1="240" x2="150" y2="400"/>
    <line x1="270" y1="210" x2="230" y2="370"/>
    <line x1="350" y1="250" x2="310" y2="410"/>
    <line x1="430" y1="230" x2="390" y2="390"/>
    <line x1="510" y1="260" x2="470" y2="420"/>

    <line x1="60" y1="420" x2="20" y2="580"/>
    <line x1="140" y1="440" x2="100" y2="600"/>
    <line x1="220" y1="410" x2="180" y2="570"/>
    <line x1="300" y1="450" x2="260" y2="610"/>
    <line x1="380" y1="430" x2="340" y2="590"/>
    <line x1="460" y1="460" x2="420" y2="620"/>
    <line x1="540" y1="420" x2="500" y2="580"/>
  </g>

  <!-- Bamboo Stems in Rain (Zen Garden Sanctuary) -->
  <g fill="none" stroke="url(#bambooGreen)" stroke-linecap="round">
    <!-- Bamboo 1 -->
    <path d="M 120 620 L 115 450" stroke-width="14"/>
    <circle cx="115" cy="450" r="8" fill="#5E7C69"/>
    <path d="M 115 450 L 110 280" stroke-width="13"/>
    <circle cx="110" cy="280" r="7.5" fill="#5E7C69"/>
    <path d="M 110 280 L 105 100" stroke-width="12"/>

    <!-- Bamboo 2 -->
    <path d="M 190 620 L 182 430" stroke-width="11"/>
    <circle cx="182" cy="430" r="6.5" fill="#5E7C69"/>
    <path d="M 182 430 L 175 240" stroke-width="10"/>
    <circle cx="175" cy="240" r="6" fill="#5E7C69"/>
    <path d="M 175 240 L 168 80" stroke-width="9"/>

    <!-- Bamboo Leaves -->
    <g fill="#43584A" stroke="none">
      <path d="M 110 280 Q 80 290 50 320 Q 80 305 110 280 Z"/>
      <path d="M 110 280 Q 130 300 150 340 Q 125 315 110 280 Z"/>
      <path d="M 105 180 Q 60 170 30 190 Q 70 180 105 180 Z"/>
      <path d="M 175 240 Q 210 230 250 245 Q 215 240 175 240 Z"/>
      <path d="M 175 240 Q 195 260 220 290 Q 195 265 175 240 Z"/>
    </g>
  </g>

  <!-- Water Ripple Rings on Stone Basin / Pond -->
  <g fill="none" stroke="#D3DDD5" opacity="0.4">
    <ellipse cx="380" cy="480" rx="45" ry="14" stroke-width="1.8"/>
    <ellipse cx="380" cy="480" rx="80" ry="24" stroke-width="1.2"/>
    <ellipse cx="380" cy="480" rx="120" ry="36" stroke-width="0.8"/>

    <ellipse cx="240" cy="530" rx="35" ry="10" stroke-width="1.5"/>
    <ellipse cx="240" cy="530" rx="65" ry="18" stroke-width="1"/>
  </g>

  <!-- Red Hanko Seal "幽" -->
  <rect x="520" y="40" width="44" height="44" rx="8" fill="#C24D3D" opacity="0.9"/>
  <text x="542" y="70" font-family="'Noto Serif JP', serif" font-size="24" font-weight="bold" fill="#FFFDF8" text-anchor="middle">幽</text>
</svg>
