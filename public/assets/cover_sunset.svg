<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1A1E"/>
      <stop offset="35%" stop-color="#5E2B2B"/>
      <stop offset="65%" stop-color="#A84C32"/>
      <stop offset="85%" stop-color="#E58245"/>
      <stop offset="100%" stop-color="#F9BE6B"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FFE39F" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#E57D3C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5E2B2B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hillFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A1715"/>
      <stop offset="100%" stop-color="#120A09"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#sunsetSky)"/>

  <!-- Golden Sun Setting behind hills -->
  <circle cx="300" cy="360" r="140" fill="url(#sunGlow)"/>
  <circle cx="300" cy="360" r="65" fill="#FFF5D6"/>

  <!-- Sun Rays Wash -->
  <polygon points="300,360 180,600 240,600" fill="#FFF8E0" opacity="0.12"/>
  <polygon points="300,360 280,600 340,600" fill="#FFF8E0" opacity="0.15"/>
  <polygon points="300,360 380,600 450,600" fill="#FFF8E0" opacity="0.12"/>

  <!-- Distant Mountain Ranges in warm dusk silhouettes -->
  <path d="M -20 380 Q 140 310 300 350 T 620 330 L 620 600 L -20 600 Z" fill="#66251E" opacity="0.75"/>
  <path d="M -20 430 Q 180 370 360 410 T 620 390 L 620 600 L -20 600 Z" fill="#3D1815" opacity="0.9"/>

  <!-- Foreground Hill with Pine Trees -->
  <path d="M -20 500 Q 180 460 380 500 T 620 480 L 620 600 L -20 600 Z" fill="url(#hillFront)"/>

  <!-- Pine Tree Silhouettes in foreground -->
  <g fill="#120A09">
    <!-- Tree 1 -->
    <path d="M 120 500 L 125 430 L 120 430 L 127 380 L 122 380 L 128 340 L 134 380 L 129 380 L 136 430 L 131 430 L 136 500 Z"/>
    <polygon points="128,340 100,380 156,380"/>
    <polygon points="128,375 90,425 166,425"/>
    <polygon points="128,420 80,480 176,480"/>

    <!-- Tree 2 -->
    <polygon points="70,390 48,430 92,430"/>
    <polygon points="70,425 40,470 100,470"/>

    <!-- Tree 3 -->
    <polygon points="500,420 475,460 525,460"/>
    <polygon points="500,455 465,505 535,505"/>
  </g>

  <!-- Flocking Birds Migrating into the Sunset -->
  <g stroke="#26100E" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 220 180 Q 228 174 235 180 Q 242 174 250 180"/>
    <path d="M 260 160 Q 268 154 275 160 Q 282 154 290 160"/>
    <path d="M 295 190 Q 301 185 307 190 Q 313 185 319 190"/>
    <path d="M 330 170 Q 336 165 342 170 Q 348 165 354 170"/>
    <path d="M 365 200 Q 371 196 376 200 Q 381 196 387 200"/>
  </g>

  <!-- Red Hanko Seal "夕" -->
  <rect x="520" y="40" width="44" height="44" rx="8" fill="#C24D3D" opacity="0.9"/>
  <text x="542" y="70" font-family="'Noto Serif JP', serif" font-size="24" font-weight="bold" fill="#FFFDF8" text-anchor="middle">夕</text>
</svg>
